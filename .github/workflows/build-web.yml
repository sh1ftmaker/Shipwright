name: Build Web (Emscripten) & Deploy to GitHub Pages

on:
  push:
    branches: [ develop, feature/emscripten-web-port ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 cmake ninja-build \
            libglew-dev libsdl2-dev libz-dev zip pkg-config

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      # On cache miss, setup-emsdk runs from a random temp dir but copies to
      # $GITHUB_WORKSPACE/emsdk-cache/. Force env to always use the workspace
      # copy so CMakeCache.txt paths stay stable across runs.
      - name: Pin emsdk to deterministic path
        run: |
          EXPECTED="$GITHUB_WORKSPACE/emsdk-cache/emsdk-main"
          if [ "$EMSDK" != "$EXPECTED" ]; then
            echo "Redirecting EMSDK from $EMSDK to $EXPECTED"
            echo "EMSDK=$EXPECTED" >> $GITHUB_ENV
            NODE_DIR=$(ls -d "$EXPECTED"/node/*/bin 2>/dev/null | head -1)
            echo "EMSDK_NODE=$NODE_DIR/node" >> $GITHUB_ENV
            echo "$EXPECTED" >> $GITHUB_PATH
            echo "$EXPECTED/upstream/emscripten" >> $GITHUB_PATH
          fi

      - name: Cache Emscripten system libs
        uses: actions/cache@v4
        with:
          path: ~/.emscripten_cache
          key: emsdk-syslibs-3.1.64-${{ runner.os }}

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build-web
          key: build-web-${{ runner.os }}-${{ hashFiles('soh/CMakeLists.txt', 'CMakeLists.txt', 'soh/src/**', 'soh/soh/**', 'libultraship', 'ZAPDTR', 'OTRExporter') }}
          restore-keys: |
            build-web-${{ runner.os }}-

      - name: Verify Emscripten
        run: emcc --version

      - name: Clean stale CMake metadata (keep .o files for incremental builds)
        run: |
          rm -rf build-web/CMakeCache.txt build-web/CMakeFiles build-web/cmake_install.cmake build-web/build.ninja build-web/.ninja_* build-web/rules.ninja

      - name: Configure CMake
        run: |
          emcmake cmake -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build for web
        run: |
          emmake cmake --build build-web --parallel 2

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp build-web/soh/soh.html _site/index.html
          cp build-web/soh/soh.js _site/
          cp build-web/soh/soh.wasm _site/
          cp build-web/soh/soh.data _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/emscripten-web-port')
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
