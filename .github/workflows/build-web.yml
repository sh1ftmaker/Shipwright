name: Build Web (Emscripten) & Deploy to GitHub Pages

on:
  push:
    branches: [ develop, feature/emscripten-web-port, feature/* ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: "web-build-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat linux-build-deps/apt.txt) zip

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      # On cache miss, setup-emsdk runs from a random temp dir but copies to
      # $GITHUB_WORKSPACE/emsdk-cache/. Force env to always use the workspace
      # copy so CMakeCache.txt paths stay stable across runs.
      - name: Pin emsdk to deterministic path
        run: |
          EXPECTED="$GITHUB_WORKSPACE/emsdk-cache/emsdk-main"
          if [ "$EMSDK" != "$EXPECTED" ]; then
            echo "Redirecting EMSDK from $EMSDK to $EXPECTED"
            echo "EMSDK=$EXPECTED" >> $GITHUB_ENV
            NODE_DIR=$(ls -d "$EXPECTED"/node/*/bin 2>/dev/null | head -1)
            echo "EMSDK_NODE=$NODE_DIR/node" >> $GITHUB_ENV
            echo "$EXPECTED" >> $GITHUB_PATH
            echo "$EXPECTED/upstream/emscripten" >> $GITHUB_PATH
          fi

      - name: Cache Emscripten system libs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/emsdk-cache/emsdk-main/upstream/emscripten/cache
          key: emsdk-syslibs-3.1.64-${{ runner.os }}

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build-web
          key: build-web-${{ github.ref_name }}-${{ runner.os }}-${{ hashFiles('soh/CMakeLists.txt', 'CMakeLists.txt', 'soh/src/**', 'soh/soh/**', 'libultraship', 'torch') }}
          restore-keys: |
            build-web-${{ github.ref_name }}-${{ runner.os }}-
            build-web-feature/emscripten-web-port-${{ runner.os }}-

      # ccache reuses compiled objects across runs by content. The cached build
      # directory alone doesn't help much: checkout gives every source a fresh
      # timestamp, so ninja would recompile all of it.
      - name: Install ccache
        run: |
          curl -sSfL https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.10.2-linux-x86_64" >> $GITHUB_PATH
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "CCACHE_NOHASHDIR=true" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV
          # emsdk is reinstalled each run, so identify the compiler by version, not mtime
          echo "CCACHE_COMPILERCHECK=string:emsdk-3.1.64" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-web-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-web-${{ github.ref_name }}-
            ccache-web-feature/emscripten-web-port-

      - name: Verify Emscripten
        run: emcc --version

      # soh.o2r (port assets) is packed by a native tools-only build of the
      # Torch-based soh-o2r-packer, so it always matches this build's version.
      - name: Build soh.o2r
        run: |
          cmake -B build-tools -G Ninja -DCMAKE_BUILD_TYPE=Release -DSOH_TOOLS_ONLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-tools --target GenerateSohOtr --parallel 2

      - name: Configure CMake
        run: |
          emcmake cmake -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # file(DOWNLOAD) in libultraship re-downloads stb_image.h every
      # configure, giving it a fresh timestamp. Since it's transitively
      # included by nearly every source file, this forces a full rebuild.
      # Backdate any freshly-touched deps to match existing .o files.
      - name: Fix dep timestamps for incremental build
        run: |
          REF=$(find build-web -name '*.o' -printf '%T@ %p\n' 2>/dev/null | sort -n 2>/dev/null | head -1 | cut -d' ' -f2)
          if [ -n "$REF" ]; then
            COUNT=$(find build-web/_deps -type f -newer "$REF" | wc -l)
            find build-web/_deps -type f -newer "$REF" -exec touch -r "$REF" {} +
            echo "Backdated $COUNT files in _deps/ to match oldest cached .o ($REF)"
          else
            echo "No cached .o files found — fresh build"
          fi

      - name: Build for web
        run: |
          emmake cmake --build build-web --parallel 2
          ccache --show-stats

      # Determine deploy path: main branch deploys to root, others to /branch-name/
      - name: Set deploy path
        id: deploy-path
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "feature/emscripten-web-port" ] || [ "$BRANCH" = "develop" ]; then
            echo "subdir=" >> $GITHUB_OUTPUT
            echo "Deploying to site root"
          else
            # Sanitize branch name for use as URL path
            SAFE_BRANCH=$(echo "$BRANCH" | sed 's|/|-|g' | sed 's|[^a-zA-Z0-9._-]|-|g')
            echo "subdir=$SAFE_BRANCH" >> $GITHUB_OUTPUT
            echo "Deploying to /$SAFE_BRANCH/"
          fi

      - name: Prepare build output
        run: |
          mkdir -p _site
          cp build-web/soh/soh.html _site/index.html
          cp build-web/soh/soh.js _site/
          cp build-web/soh/soh.wasm _site/
          cp build-web/soh/soh.data _site/ 2>/dev/null || true
          cp build-tools/soh/soh.o2r _site/
          cp soh/soh/web/soh-save-*.zip _site/

      # Deploy to gh-pages branch (supports per-branch subdirectories)
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: ${{ steps.deploy-path.outputs.subdir }}
          keep_files: true
