<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ship of Harkinian - Web</title>
  <script>
    // ---- Debug log ----
    // Records console output and errors from the very start, keeps the last lines in localStorage so
    // they survive a frozen or crashed tab, and shows them in a panel (the "Log" button) with Copy.
    // The button shows while loading, or always with ?debug in the URL.
    var DebugLog = (function() {
      var KEY = 'soh-debug-log', PREV_KEY = 'soh-debug-log-prev', MAX_LINES = 3000;
      var t0 = performance.now();
      var lines = [];
      var lastSave = 0;
      var previous = null;
      try {
        previous = localStorage.getItem(KEY);
        if (previous) localStorage.setItem(PREV_KEY, previous);
        else previous = localStorage.getItem(PREV_KEY);
      } catch (e) {}

      function save(force) {
        var now = performance.now();
        if (!force && now - lastSave < 300) return;
        lastSave = now;
        try { localStorage.setItem(KEY, lines.join('\n')); } catch (e) {}
      }
      function fmt(a) {
        if (a instanceof Error) return a.stack || (a.name + ': ' + a.message);
        if (typeof a === 'object' && a !== null) { try { return JSON.stringify(a); } catch (e) { return String(a); } }
        return String(a);
      }
      function add(level, args) {
        var text = Array.prototype.map.call(args, fmt).join(' ');
        var line = ((performance.now() - t0) / 1000).toFixed(2).padStart(7) + 's ' + level + ' ' + text;
        lines.push(line);
        if (lines.length > MAX_LINES) lines.splice(1, lines.length - MAX_LINES); // keep the header line
        save(level === 'ERR');
        if (panelText && panelOpen) render();
      }

      ['log', 'info', 'warn', 'error', 'debug'].forEach(function(m) {
        var orig = console[m].bind(console);
        var level = m === 'error' ? 'ERR' : m === 'warn' ? 'WRN' : 'LOG';
        console[m] = function() { add(level, arguments); orig.apply(null, arguments); };
      });
      window.addEventListener('error', function(e) {
        add('ERR', ['Uncaught: ' + (e.error ? fmt(e.error) : e.message) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')]);
        open();
      });
      window.addEventListener('unhandledrejection', function(e) {
        add('ERR', ['Unhandled rejection: ' + fmt(e.reason)]);
      });
      window.addEventListener('pagehide', function() { add('LOG', ['page hidden/unloaded']); save(true); });
      document.addEventListener('visibilitychange', function() { add('LOG', ['visibility: ' + document.visibilityState]); save(true); });

      function deviceInfo() {
        var gl2 = 'no';
        try {
          var c = document.createElement('canvas').getContext('webgl2');
          if (c) gl2 = 'yes, max texture ' + c.getParameter(c.MAX_TEXTURE_SIZE);
        } catch (e) { gl2 = 'error ' + e.message; }
        return [
          'UA: ' + navigator.userAgent,
          'screen ' + screen.width + 'x' + screen.height + ' @' + devicePixelRatio + 'x, viewport ' + innerWidth + 'x' + innerHeight,
          'cores ' + (navigator.hardwareConcurrency || '?') + ', device memory ' + (navigator.deviceMemory || '?') + ' GB, touch points ' + navigator.maxTouchPoints,
          'WebGL2 ' + gl2 + ', WebAssembly ' + (typeof WebAssembly === 'object' ? 'yes' : 'no') + ', secure ' + window.isSecureContext,
          'page ' + location.href.split('#')[0],
        ].join(' | ');
      }
      lines.push('    0.00s LOG ' + new Date().toISOString() + ' | ' + deviceInfo());
      save(true);

      // Memory snapshot, for logging around heavy steps
      function mem() {
        var parts = [];
        try { if (typeof HEAP8 !== 'undefined') parts.push('wasm heap ' + (HEAP8.length / 1048576).toFixed(0) + ' MB'); } catch (e) {}
        if (performance.memory) parts.push('JS heap ' + (performance.memory.usedJSHeapSize / 1048576).toFixed(0) + '/' + (performance.memory.jsHeapSizeLimit / 1048576).toFixed(0) + ' MB');
        return parts.join(', ') || 'memory n/a';
      }

      // ---- panel ----
      var panel, panelText, panelOpen = false, button;
      function render() {
        panelText.value = lines.join('\n');
        panelText.scrollTop = panelText.scrollHeight;
      }
      function copy(text, label) {
        var done = function() { add('LOG', ['copied ' + label + ' (' + text.length + ' chars)']); flash(label + ' copied'); };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(done, function() { fallbackCopy(text) && done(); });
        } else if (fallbackCopy(text)) {
          done();
        }
      }
      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        ta.remove();
        if (!ok) flash('Copy failed - select the text and copy it manually');
        return ok;
      }
      function flash(msg) {
        var el = document.getElementById('debug-flash');
        if (!el) return;
        el.textContent = msg;
        setTimeout(function() { el.textContent = ''; }, 2500);
      }
      function open() {
        if (!panel) return;
        panelOpen = true;
        panel.style.display = 'flex';
        render();
      }
      function close() {
        panelOpen = false;
        if (panel) panel.style.display = 'none';
      }
      function build() {
        var css = document.createElement('style');
        css.textContent =
          '#debug-btn{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:10001;' +
          'padding:8px 14px;border-radius:18px;border:1px solid #445;background:rgba(17,17,40,.9);color:#cde;font:13px monospace}' +
          '#debug-panel{position:fixed;inset:0;z-index:10002;display:none;flex-direction:column;background:#0a0a1a;color:#cde;' +
          'padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}' +
          '#debug-panel .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}' +
          '#debug-panel button{padding:9px 12px;border-radius:8px;border:1px solid #446;background:#1a1a3a;color:#def;font:14px sans-serif}' +
          '#debug-panel textarea{flex:1;width:100%;background:#05050f;color:#bcd;border:1px solid #334;border-radius:6px;' +
          'font:11px/1.35 monospace;padding:6px;white-space:pre-wrap;word-break:break-all;overflow:auto;touch-action:pan-x pan-y}' +
          '#debug-flash{color:#8f8;font:13px sans-serif}';
        document.head.appendChild(css);

        button = document.createElement('button');
        button.id = 'debug-btn';
        button.textContent = 'Log';
        button.onclick = open;
        document.body.appendChild(button);

        panel = document.createElement('div');
        panel.id = 'debug-panel';
        panel.innerHTML =
          '<div class="row"><b style="font:15px sans-serif">Debug log</b><span id="debug-flash"></span></div>' +
          '<div class="row"><button data-a="copy">Copy log</button><button data-a="prev">Copy previous session</button>' +
          '<button data-a="mem">Log memory</button><button data-a="clear">Clear</button><button data-a="close">Close</button></div>' +
          '<textarea readonly spellcheck="false"></textarea>';
        panelText = panel.querySelector('textarea');
        panel.addEventListener('click', function(e) {
          var a = e.target.getAttribute && e.target.getAttribute('data-a');
          if (a === 'copy') copy(lines.join('\n'), 'log');
          else if (a === 'prev') previous ? copy(previous, 'previous session') : flash('No previous session saved');
          else if (a === 'mem') add('LOG', [mem()]);
          else if (a === 'clear') { lines.length = 1; save(true); render(); }
          else if (a === 'close') close();
        });
        document.body.appendChild(panel);
        if (previous) add('LOG', ['previous session log saved (' + previous.split('\n').length + ' lines) - "Copy previous session" to get it']);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build); else build();

      return {
        add: function(level) { add(level, Array.prototype.slice.call(arguments, 1)); },
        mem: mem,
        open: open,
        // In game the button is hidden unless ?debug is in the URL
        gameStarted: function() {
          if (button && !/[?&#]debug\b/.test(location.href)) button.style.display = 'none';
        },
      };
    })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* The page must never zoom or scroll: touches are mapped to the canvas assuming it sits at 0,0 at 1x */
      overscroll-behavior: none;
      touch-action: none;
      background: #0a0a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
    }

    #canvas {
      touch-action: none; /* no double-tap zoom or panning over the game; ImGui scrolling is handled below */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      outline: none;
      z-index: 1;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay h1 {
      font-size: 2.2rem;
      margin-bottom: 0.3rem;
      color: #ffffff;
    }

    #overlay .subtitle {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 2rem;
    }

    #otr-picker {
      background: #111128;
      border: 2px dashed #2a2a5a;
      border-radius: 12px;
      padding: 2rem 3rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      margin-bottom: 1.5rem;
    }

    #otr-picker:hover {
      border-color: #5588ff;
      background: #15153a;
    }

    #otr-picker p {
      font-size: 1.05rem;
      margin-bottom: 0.5rem;
    }

    #otr-picker .hint {
      font-size: 0.82rem;
      color: #666;
    }

    #otr-file {
      display: none;
    }

    #progress-container {
      width: 320px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    #progress-bar-outer {
      width: 100%;
      height: 8px;
      background: #111128;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    #progress-bar-inner {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #5588ff, #2244aa);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    #progress-bar-inner.extracting {
      transition: none;
      animation: fake-progress 30s cubic-bezier(0.1, 0.4, 0.2, 0.85) forwards;
    }

    @keyframes fake-progress {
      0%   { width: 25%; }
      100% { width: 90%; }
    }

    #status {
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
      min-height: 1.5em;
    }

    #error-msg {
      color: #ff5566;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      min-height: 1.5em;
      text-align: center;
    }

    /* Touch Gamepad */
    #touch-gamepad {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 5; pointer-events: none; user-select: none; -webkit-user-select: none;
    }
    #touch-gamepad.visible { display: block; }
    #touch-stick-zone {
      position: absolute; left: 10px; bottom: 10px; width: 160px; height: 160px;
      pointer-events: auto; touch-action: none;
    }
    #touch-stick-base {
      position: absolute; left: 20px; bottom: 20px; width: 120px; height: 120px;
      border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.2);
    }
    #touch-stick-knob {
      position: absolute; width: 50px; height: 50px; border-radius: 50%;
      background: rgba(255,255,255,0.35); left: 35px; top: 35px;
      pointer-events: none; transition: none;
    }
    .touch-btn {
      position: absolute; pointer-events: auto; touch-action: none;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: monospace; font-weight: bold; color: rgba(255,255,255,0.7);
      border: 2px solid rgba(255,255,255,0.2);
    }
    .touch-btn:active, .touch-btn.pressed { background: rgba(255,255,255,0.3) !important; }
    #tb-a { right: 20px; bottom: 100px; width: 64px; height: 64px; background: rgba(255,255,255,0.12); font-size: 22px; }
    #tb-b { right: 90px; bottom: 50px; width: 56px; height: 56px; background: rgba(255,255,255,0.1); font-size: 18px; }
    #tb-z { right: 160px; bottom: 100px; width: 50px; height: 50px; background: rgba(255,255,255,0.08); font-size: 16px; }
    #tb-start { top: 10px; left: 50%; transform: translateX(-50%); width: 60px; height: 34px;
      border-radius: 17px; background: rgba(255,255,255,0.08); font-size: 11px; }
    #tb-r { right: 20px; top: 10px; width: 50px; height: 34px;
      border-radius: 17px; background: rgba(255,255,255,0.08); font-size: 14px; }
    #tb-l { left: 10px; top: 10px; width: 50px; height: 34px;
      border-radius: 17px; background: rgba(255,255,255,0.08); font-size: 14px; }
    .touch-cbtn {
      position: absolute; pointer-events: auto; touch-action: none;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: monospace; font-size: 12px; font-weight: bold;
      color: rgba(255,200,50,0.7); background: rgba(255,200,50,0.08);
      border: 2px solid rgba(255,200,50,0.15);
    }
    .touch-cbtn:active, .touch-cbtn.pressed { background: rgba(255,200,50,0.3) !important; }
    #tb-cu { right: 110px; bottom: 210px; }
    #tb-cd { right: 110px; bottom: 140px; }
    #tb-cl { right: 145px; bottom: 175px; }
    #tb-cr { right: 75px; bottom: 175px; }
    #tb-esc { top: 10px; right: 80px; width: 34px; height: 34px;
      border-radius: 8px; background: rgba(255,255,255,0.08); font-size: 10px;
      letter-spacing: -0.5px; }

    /* Portrait phones: the game keeps the whole screen (the renderer widens the view, see
       PortraitZoomOut) and the controls sit over its lower part, with L/START/ESC/R above them.
       The page tells the renderer where the controls start (PortraitBottomInset) so the HUD's lower
       half and the 3D view's center stay above them. */
    @media (orientation: portrait) {
      html.touch-device { --pad-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
      html.touch-device #touch-stick-zone { left: 8px; bottom: var(--pad-bottom); width: 180px; height: 180px; }
      html.touch-device #touch-stick-base { left: 15px; bottom: 15px; width: 150px; height: 150px; }
      html.touch-device #touch-stick-knob { width: 60px; height: 60px; left: 45px; top: 45px; }
      html.touch-device #tb-a { right: 20px; bottom: calc(var(--pad-bottom) + 70px); width: 76px; height: 76px; font-size: 26px; }
      html.touch-device #tb-b { right: 106px; bottom: var(--pad-bottom); width: 68px; height: 68px; font-size: 22px; }
      /* Z sits above the stick, like the N64's trigger under the left hand */
      html.touch-device #tb-z { left: 40px; right: auto; bottom: calc(var(--pad-bottom) + 200px); width: 120px; height: 48px;
        border-radius: 24px; font-size: 18px; }
      html.touch-device .touch-cbtn { width: 46px; height: 46px; font-size: 14px; }
      html.touch-device #tb-cu { right: 82px; bottom: calc(var(--pad-bottom) + 254px); }
      html.touch-device #tb-cd { right: 82px; bottom: calc(var(--pad-bottom) + 166px); }
      html.touch-device #tb-cl { right: 126px; bottom: calc(var(--pad-bottom) + 210px); }
      html.touch-device #tb-cr { right: 38px; bottom: calc(var(--pad-bottom) + 210px); }
      html.touch-device #tb-l,
      html.touch-device #tb-r,
      html.touch-device #tb-start,
      html.touch-device #tb-esc { top: auto; bottom: calc(var(--pad-bottom) + 316px); height: 40px; border-radius: 20px; }
      html.touch-device #tb-l { left: 16px; width: 64px; }
      html.touch-device #tb-r { right: 16px; width: 64px; }
      html.touch-device #tb-start { width: 84px; font-size: 13px; }
      html.touch-device #tb-esc { right: 96px; width: 48px; border-radius: 12px; }
      /* While the settings menu is open only ESC stays, to close it */
      html.touch-device.menu-open #touch-gamepad > :not(#tb-esc) { display: none; }
      html.touch-device.menu-open #tb-esc { bottom: var(--pad-bottom); right: 16px; width: 64px; height: 48px;
        background: rgba(10,10,26,0.85); }
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Ship of Harkinian</h1>
    <p class="subtitle">WebAssembly Port</p>

    <div id="otr-picker" onclick="document.getElementById('otr-file').click()">
      <p>Click or drag to load game files</p>
      <p class="hint">Requires soh.o2r and either oot.o2r or a .z64 ROM</p>
    </div>
    <input type="file" id="otr-file" accept=".otr,.o2r,.z64,.n64,.v64" multiple>

    <div id="progress-container">
      <div id="progress-bar-outer">
        <div id="progress-bar-inner"></div>
      </div>
      <div id="status">Initializing...</div>
    </div>

    <div id="error-msg"></div>
  </div>

  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <!-- Hidden input for mobile keyboard on Emscripten (iOS/Android) -->
  <input id="mobile-keyboard-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    style="position:fixed;left:-9999px;top:50%;width:1px;height:1px;opacity:0;z-index:-1;font-size:16px;" />

  <div id="touch-gamepad">
    <div id="touch-stick-zone">
      <div id="touch-stick-base">
        <div id="touch-stick-knob"></div>
      </div>
    </div>
    <div class="touch-btn" id="tb-a">A</div>
    <div class="touch-btn" id="tb-b">B</div>
    <div class="touch-btn" id="tb-z">Z</div>
    <div class="touch-btn" id="tb-start">START</div>
    <div class="touch-btn" id="tb-r">R</div>
    <div class="touch-btn" id="tb-l">L</div>
    <div class="touch-btn" id="tb-esc">ESC</div>
    <div class="touch-cbtn" id="tb-cu">▲</div>
    <div class="touch-cbtn" id="tb-cd">▼</div>
    <div class="touch-cbtn" id="tb-cl">◀</div>
    <div class="touch-cbtn" id="tb-cr">▶</div>
  </div>

  <script>
    var OTR_DB_NAME = 'soh_otr_files';
    var OTR_DB_STORE = 'otr';
    var OTR_DB_VERSION = 1;

    var otrFilesReady = false;
    var audioResumed = false;
    var gameStarted = false;
    var requiredFiles = {};

    // ---- IndexedDB helpers ----

    function openOtrDB() {
      return new Promise(function(resolve, reject) {
        var req = indexedDB.open(OTR_DB_NAME, OTR_DB_VERSION);
        req.onupgradeneeded = function(e) {
          e.target.result.createObjectStore(OTR_DB_STORE);
        };
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function(e) { reject(e.target.error); };
      });
    }

    function getCachedFile(name) {
      return openOtrDB().then(function(db) {
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(OTR_DB_STORE, 'readonly');
          var store = tx.objectStore(OTR_DB_STORE);
          var req = store.get(name);
          req.onsuccess = function() { resolve(req.result || null); };
          req.onerror = function() { resolve(null); };
        });
      });
    }

    function cacheFile(name, arrayBuffer) {
      return openOtrDB().then(function(db) {
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(OTR_DB_STORE, 'readwrite');
          var store = tx.objectStore(OTR_DB_STORE);
          store.put(arrayBuffer, name);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function(e) { reject(e.target.error); };
        });
      });
    }

    function listCachedFiles() {
      return openOtrDB().then(function(db) {
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(OTR_DB_STORE, 'readonly');
          var store = tx.objectStore(OTR_DB_STORE);
          var req = store.getAllKeys();
          req.onsuccess = function() { resolve(req.result || []); };
          req.onerror = function() { resolve([]); };
        });
      });
    }

    // ---- UI helpers ----

    function showError(msg) {
      document.getElementById('error-msg').textContent = msg;
      if (msg) console.error('[Web] ' + msg);
    }

    var lastLoggedStatus = '';
    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
      // Log status changes, but not counters ("Loading... (2917 remaining)", "Downloading 34%")
      var shape = String(msg).replace(/[0-9]+/g, '#');
      if (shape !== lastLoggedStatus) {
        lastLoggedStatus = shape;
        console.log('[Status] ' + msg);
      }
    }

    function setProgress(pct) {
      document.getElementById('progress-bar-inner').style.width = pct + '%';
    }

    function showProgress() {
      document.getElementById('otr-picker').style.display = 'none';
      document.getElementById('progress-container').style.display = 'flex';
    }

    function hideProgress() {
      document.getElementById('otr-picker').style.display = '';
      document.getElementById('progress-container').style.display = 'none';
    }

    function hideOverlay() {
      var el = document.getElementById('overlay');
      if (el.classList.contains('hidden')) return;
      el.classList.add('hidden');
      gameStarted = true;
      console.log('[Web] Game started (' + DebugLog.mem() + ')');
      DebugLog.gameStarted();
      // Fully remove from layout after fade-out transition
      setTimeout(function() { el.style.display = 'none'; }, 600);
      document.getElementById('canvas').focus();
    }

    // ---- Write OTR files to Emscripten FS ----

    function getWritePath() {
      // Game looks for OTR files relative to cwd which is "/"
      return '/';
    }

    function writeOtrToFS(name, arrayBuffer) {
      try {
        var data = new Uint8Array(arrayBuffer);
        var writePath = getWritePath();

        var filePath = writePath + name;
        FS.writeFile(filePath, data);
        console.log('[Web] OTR written to ' + filePath + ' (' + data.length + ' bytes)');
        return true;
      } catch (e) {
        showError('Failed to write ' + name + ' to virtual filesystem: ' + e.message);
        console.error('[Web] writeOtrToFS error:', e);
        return false;
      }
    }

    function validateRequiredFiles() {
      // Check that at least soh.o2r and one oot archive exist in the virtual FS
      try {
        var hasSoh = false;
        var hasOot = false;
        var files = FS.readdir('/');
        for (var i = 0; i < files.length; i++) {
          var f = files[i].toLowerCase();
          if (f === 'soh.o2r') hasSoh = true;
          if (f === 'oot.o2r' || f === 'oot-mq.o2r') hasOot = true;
        }
        if (!hasSoh) return 'Missing soh.o2r — please upload the SoH archive.';
        if (!hasOot) return 'Missing oot.o2r — please upload an OoT archive.';
        return null;
      } catch (e) {
        return null; // FS not ready, let engine handle it
      }
    }

    function finalizeOtrLoad() {
      var error = validateRequiredFiles();
      if (error) {
        showError(error);
        hideProgress();
        return;
      }

      otrFilesReady = true;
      setStatus('Game files loaded. Starting...');
      setProgress(100);

      // Configure Anchor networking from URL hash before starting the game
      configureAnchorFromHash();

      // Tell the C side that OTR files are ready
      if (typeof Module._web_otr_loaded === 'function') {
        Module._web_otr_loaded();
      }

      waitForGameRender();
    }

    // ---- Eager prefetch of soh.o2r ----
    // Starts immediately at page load, in parallel with WASM compilation.
    // The result is written to the Emscripten FS once the runtime is ready.

    var _sohO2rPromise = (function() {
      // First check IndexedDB cache
      return getCachedFile('soh.o2r').then(function(buf) {
        if (buf) {
          console.log('[Web] soh.o2r found in IndexedDB cache (' + buf.byteLength + ' bytes)');
          return buf;
        }
        // Not cached — fetch from server
        return new Promise(function(resolve, reject) {
          console.log('[Web] Prefetching soh.o2r from server...');
          var xhr = new XMLHttpRequest();
          xhr.open('GET', 'soh.o2r', true);
          xhr.responseType = 'arraybuffer';
          xhr.onload = function() {
            if (xhr.status === 200) {
              console.log('[Web] soh.o2r downloaded: ' + xhr.response.byteLength + ' bytes');
              cacheFile('soh.o2r', xhr.response).catch(function() {});
              resolve(xhr.response);
            } else {
              reject('HTTP ' + xhr.status);
            }
          };
          xhr.onerror = function() { reject('network error'); };
          xhr.send();
        });
      }).catch(function(err) {
        console.warn('[Web] Failed to prefetch soh.o2r:', err);
        return null;
      });
    })();

    function installSohO2r() {
      return _sohO2rPromise.then(function(buf) {
        if (buf) {
          writeOtrToFS('soh.o2r', buf);
          return true;
        }
        return false;
      });
    }

    // ---- ROM detection helpers ----

    function isRomFile(name) {
      var ext = name.toLowerCase().split('.').pop();
      return ext === 'z64' || ext === 'n64' || ext === 'v64';
    }

    function extractRomInBrowser(romArrayBuffer, romFileName) {
      setStatus('Writing ROM to virtual filesystem...');
      setProgress(20);
      console.log('[Web] ROM ' + romFileName + ': ' + romArrayBuffer.byteLength + ' bytes (' + DebugLog.mem() + ')');

      var romData = new Uint8Array(romArrayBuffer);
      try {
        FS.writeFile('/rom.z64', romData);
      } catch (e) {
        showError('Failed to write ROM to virtual filesystem: ' + e.message);
        hideProgress();
        return;
      }

      setStatus('Extracting ROM assets (~25 seconds)...');
      setProgress(25);

      // Start CSS animation for fake progress (runs on compositor thread,
      // keeps animating even while the main thread is blocked by WASM)
      var bar = document.getElementById('progress-bar-inner');
      bar.classList.add('extracting');

      // Run extraction (synchronous — Torch runs single-threaded)
      // Use setTimeout to allow the UI/animation to start before blocking
      setTimeout(function() {
        var romPathPtr = Module.allocateUTF8('/rom.z64');
        var outPathPtr = Module.allocateUTF8('/oot.o2r');
        var extractStart = performance.now();
        console.log('[Web] Extraction starting (' + DebugLog.mem() + '). The page is unresponsive until it finishes.');
        var result;
        try {
          result = Module._web_extract_rom(romPathPtr, outPathPtr);
        } catch (e) {
          // Out of memory, a wasm trap or an abort lands here instead of leaving the page stuck
          console.error('[Web] Extraction threw after ' + ((performance.now() - extractStart) / 1000).toFixed(1) + 's: ' +
                        (e && e.stack ? e.stack : e) + ' (' + DebugLog.mem() + ')');
          bar.classList.remove('extracting');
          showError('ROM extraction crashed: ' + (e && e.message ? e.message : e) + '. Tap "Log" and copy it.');
          hideProgress();
          DebugLog.open();
          return;
        }
        console.log('[Web] Extraction returned ' + result + ' after ' + ((performance.now() - extractStart) / 1000).toFixed(1) + 's (' + DebugLog.mem() + ')');
        Module._free(romPathPtr);
        Module._free(outPathPtr);

        if (result < 0) {
          bar.classList.remove('extracting');
          showError('ROM extraction failed (error ' + result + '). Check the browser console for details.');
          hideProgress();
          try { FS.unlink('/rom.z64'); } catch(e) {}
          return;
        }

        // result: 0 = vanilla (oot.o2r), 1 = MQ (oot-mq.o2r)
        var actualOutputName = result === 1 ? 'oot-mq.o2r' : 'oot.o2r';
        var actualOutputPath = '/' + actualOutputName;

        // Stop fake progress animation and jump to real progress
        bar.classList.remove('extracting');
        setStatus('Caching extracted archive...');
        setProgress(80);

        // Read the generated .o2r from MEMFS and cache it
        try {
          var o2rData = FS.readFile(actualOutputPath);
          var o2rBuffer = o2rData.buffer;

          cacheFile(actualOutputName, o2rBuffer).then(function() {
            console.log('[Web] Cached ' + actualOutputName + ' to IndexedDB (' + o2rData.length + ' bytes)');
            // Clean up ROM from MEMFS (save memory)
            try { FS.unlink('/rom.z64'); } catch(e) {}
            setProgress(90);
            setStatus('Extraction complete.');
            finalizeOtrLoad();
          }).catch(function(err) {
            console.warn('[Web] Failed to cache ' + actualOutputName + ':', err);
            try { FS.unlink('/rom.z64'); } catch(e) {}
            finalizeOtrLoad();
          });
        } catch (e) {
          showError('Failed to read extracted archive: ' + e.message);
          hideProgress();
        }
      }, 50);
    }

    // ---- File handler ----

    function handleOtrFiles(files) {
      showError('');
      showProgress();
      setStatus('Reading game files...');
      setProgress(10);

      var romFiles = [];
      var otrFiles = [];

      for (var i = 0; i < files.length; i++) {
        console.log('[Web] Picked file: ' + files[i].name + ' (' + files[i].size + ' bytes, type "' + files[i].type + '")');
        if (isRomFile(files[i].name)) {
          romFiles.push(files[i]);
        } else {
          otrFiles.push(files[i]);
        }
      }

      var processed = 0;
      var totalOtr = otrFiles.length;
      var pendingRom = romFiles.length > 0 ? romFiles[0] : null;

      function onAllOtrProcessed() {
        if (pendingRom) {
          // Read and extract the ROM after OTR files are loaded
          setStatus('Reading ROM file...');
          setProgress(15);
          var reader = new FileReader();
          reader.onload = function(e) {
            extractRomInBrowser(e.target.result, pendingRom.name);
          };
          reader.onerror = function() {
            console.error('[Web] FileReader error: ' + (reader.error && reader.error.message));
            showError('Failed to read ROM file: ' + pendingRom.name);
            hideProgress();
          };
          reader.readAsArrayBuffer(pendingRom);
        } else {
          setProgress(90);
          setStatus('All files loaded.');
          finalizeOtrLoad();
        }
      }

      if (totalOtr === 0) {
        onAllOtrProcessed();
        return;
      }

      for (var i = 0; i < otrFiles.length; i++) {
        (function(file) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var buf = e.target.result;
            var name = file.name.toLowerCase();

            setProgress(10 + (processed / totalOtr) * 60);
            setStatus('Caching ' + file.name + '...');

            // Cache for future visits
            cacheFile(name, buf).then(function() {
              writeOtrToFS(name, buf);
              processed++;
              if (processed === totalOtr) {
                onAllOtrProcessed();
              }
            }).catch(function() {
              writeOtrToFS(name, buf);
              processed++;
              if (processed === totalOtr) {
                onAllOtrProcessed();
              }
            });
          };
          reader.onerror = function() {
            showError('Failed to read ' + file.name);
          };
          reader.readAsArrayBuffer(file);
        })(otrFiles[i]);
      }
    }

    document.getElementById('otr-file').addEventListener('change', function(e) {
      if (e.target.files.length > 0) {
        handleOtrFiles(e.target.files);
      }
    });

    // Drag-and-drop
    document.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.stopPropagation();
    });
    document.addEventListener('drop', function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (e.dataTransfer.files.length > 0) {
        handleOtrFiles(e.dataTransfer.files);
      }
    });

    // ---- Audio context resume ----
    // iOS problem: Emscripten's SDL2 registers one-shot (listenOnce) gesture
    // listeners via autoResumeAudioContext. These fire and are removed before
    // SDL has created its AudioContext on first page load. After that, no
    // listeners remain and audio is permanently broken.
    //
    // Fix: Register PERSISTENT listeners that keep trying on every interaction.

    function resumeAudio() {
      if (audioResumed) return;
      try {
        var ctx = Module.SDL2 && Module.SDL2.audioContext;
        if (!ctx) return;
        if (ctx.state === 'running') {
          audioResumed = true;
          return;
        }
        if (ctx.state === 'suspended') {
          ctx.resume().then(function() {
            if (ctx.state === 'running') {
              audioResumed = true;
              console.log('[Web] AudioContext resumed');
            }
          }).catch(function() {});
        }
      } catch(e) {}
    }

    // Persistent listeners on document (unlike Emscripten's one-shot listeners)
    ['click', 'mousedown', 'keydown', 'touchstart', 'touchend', 'pointerdown', 'pointerup'].forEach(function(evt) {
      document.addEventListener(evt, resumeAudio, true);
    });

    // Also bind directly on the canvas once it exists
    function bindCanvasAudio() {
      var c = document.getElementById('canvas');
      if (c && !c._audioBound) {
        c._audioBound = true;
        ['touchstart', 'touchend', 'mousedown', 'click', 'pointerdown', 'pointerup'].forEach(function(evt) {
          c.addEventListener(evt, resumeAudio, true);
        });
      }
    }
    bindCanvasAudio();
    setTimeout(bindCanvasAudio, 2000);

    // ---- Watch for game rendering ----

    function waitForGameRender() {
      var canvas = document.getElementById('canvas');
      var checkInterval = setInterval(function() {
        try {
          var ctx = canvas.getContext('webgl2') || canvas.getContext('webgl');
          if (ctx) {
            // Check if the canvas has any non-zero pixels anywhere (not just center)
            var pixels = new Uint8Array(4);
            // Sample a few points — game may render non-black outside center
            var points = [
              [canvas.width/2, canvas.height/2],
              [canvas.width/4, canvas.height/4],
              [canvas.width*3/4, canvas.height/4]
            ];
            for (var i = 0; i < points.length; i++) {
              ctx.readPixels(points[i][0], points[i][1], 1, 1, ctx.RGBA, ctx.UNSIGNED_BYTE, pixels);
              if (pixels[0] > 0 || pixels[1] > 0 || pixels[2] > 0) {
                hideOverlay();
                clearInterval(checkInterval);
                return;
              }
            }
          }
        } catch(e) {}
      }, 200);
      // Fallback: hide after 5 seconds regardless
      setTimeout(function() { clearInterval(checkInterval); hideOverlay(); }, 5000);
    }

    // ---- URL hash parameter: #rom=URL ----

    function getHashParams() {
      var params = {};
      var hash = window.location.hash.substring(1);
      if (!hash) return params;
      hash.split('&').forEach(function(part) {
        var eq = part.indexOf('=');
        if (eq > 0) {
          params[decodeURIComponent(part.substring(0, eq))] = decodeURIComponent(part.substring(eq + 1));
        }
      });
      return params;
    }

    function fetchRomFromUrl(url) {
      showProgress();
      setStatus('Downloading ROM from URL...');
      setProgress(5);
      console.log('[Web] Fetching ROM from: ' + url);

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'arraybuffer';

      xhr.onprogress = function(e) {
        if (e.lengthComputable) {
          var pct = Math.round((e.loaded / e.total) * 100);
          setProgress(5 + pct * 0.4);
          setStatus('Downloading ROM... ' + pct + '%');
        }
      };

      xhr.onload = function() {
        if (xhr.status === 200) {
          console.log('[Web] ROM downloaded: ' + xhr.response.byteLength + ' bytes');
          setStatus('ROM downloaded. Preparing extraction...');
          setProgress(50);

          // Determine filename from URL or use default
          var urlPath = url.split('?')[0].split('#')[0];
          var fileName = urlPath.split('/').pop() || 'rom.z64';
          if (!isRomFile(fileName)) fileName = 'rom.z64';

          extractRomInBrowser(xhr.response, fileName);
        } else {
          showError('Failed to download ROM: HTTP ' + xhr.status);
          hideProgress();
        }
      };

      xhr.onerror = function() {
        showError('Failed to download ROM. Check CORS and URL.');
        hideProgress();
      };

      xhr.send();
    }

    function checkHashRom() {
      var params = getHashParams();
      if (params.rom) {
        fetchRomFromUrl(params.rom);
        return true;
      }
      return false;
    }

    // ---- URL hash parameter: #soh=URL&oot=URL for .o2r files ----

    // Convert Google Drive share URLs to direct download URLs
    function toDirectUrl(url) {
      var match = url.match(/drive\.google\.com\/file\/d\/([^\/]+)/);
      if (match) {
        return 'https://drive.google.com/uc?export=download&id=' + match[1];
      }
      return url;
    }

    function fetchO2rFromUrl(url, name, onProgress, onDone) {
      var directUrl = toDirectUrl(url);
      console.log('[Web] Fetching ' + name + ' from: ' + directUrl);

      var xhr = new XMLHttpRequest();
      xhr.open('GET', directUrl, true);
      xhr.responseType = 'arraybuffer';

      xhr.onprogress = function(e) {
        if (e.lengthComputable) {
          onProgress(e.loaded, e.total);
        }
      };

      xhr.onload = function() {
        if (xhr.status === 200) {
          var buf = xhr.response;
          console.log('[Web] Downloaded ' + name + ': ' + buf.byteLength + ' bytes');
          cacheFile(name, buf).then(function() {
            writeOtrToFS(name, buf);
            onDone(null);
          }).catch(function() {
            writeOtrToFS(name, buf);
            onDone(null);
          });
        } else {
          onDone('HTTP ' + xhr.status);
        }
      };

      xhr.onerror = function() {
        onDone('Network error (check CORS)');
      };

      xhr.send();
    }

    function checkHashO2r() {
      var params = getHashParams();
      if (!params.soh && !params.oot) return false;

      showProgress();
      var downloads = [];
      if (params.soh) downloads.push({ url: params.soh, name: 'soh.o2r' });
      if (params.oot) downloads.push({ url: params.oot, name: 'oot.o2r' });

      var completed = 0;
      var total = downloads.length;
      var errors = [];

      setStatus('Downloading game archives (' + total + ' files)...');
      setProgress(5);

      downloads.forEach(function(dl, idx) {
        fetchO2rFromUrl(dl.url, dl.name,
          function(loaded, fileTotal) {
            var filePct = Math.round((loaded / fileTotal) * 100);
            setStatus('Downloading ' + dl.name + '... ' + filePct + '%');
            var overallPct = 5 + ((completed + (loaded / fileTotal)) / total) * 85;
            setProgress(Math.round(overallPct));
          },
          function(err) {
            completed++;
            if (err) errors.push(dl.name + ': ' + err);
            if (completed === total) {
              if (errors.length > 0) {
                showError('Download failed: ' + errors.join(', '));
                hideProgress();
              } else {
                setProgress(95);
                setStatus('All archives downloaded.');
                finalizeOtrLoad();
              }
            }
          }
        );
      });

      return true;
    }

    // ---- URL hash parameter: Anchor/PartyKit networking config ----
    // Params: room, name, color (hex RGB), team
    // Example: #room=myroom&name=Player1&color=FF0000&team=red

    function configureAnchorFromHash() {
      var params = getHashParams();
      if (!params.room && !params.name && !params.color && !params.team) return false;

      // Store config as globals for C++ to read via EM_JS during game init
      window._anchorConfig = {
        room:  params.room  || 'default',
        name:  params.name  || '',
        color: params.color || '',
        team:  params.team  || 'default'
      };

      console.log('[Web] Anchor config stored for game init:', window._anchorConfig);
      return true;
    }

    // ---- Check for cached OTR files on load ----

    function checkCachedOtr() {
      listCachedFiles().then(function(keys) {
        if (keys.length > 0) {
          showProgress();
          setStatus('Found cached game files. Loading...');
          setProgress(10);

          var loaded = 0;
          var total = keys.length;

          function tryLoadCached() {
            if (typeof FS === 'undefined') {
              setTimeout(tryLoadCached, 100);
              return;
            }

            keys.forEach(function(key) {
              getCachedFile(key).then(function(buf) {
                if (buf) {
                  writeOtrToFS(key, buf);
                }
                loaded++;
                setProgress(10 + (loaded / total) * 80);
                if (loaded === total) {
                  finalizeOtrLoad();
                }
              });
            });
          }

          tryLoadCached();
        }
      }).catch(function() {
        // No cached files
      });
    }

    // ---- Emscripten Module configuration ----

    var Module = {
      canvas: (function() {
        return document.getElementById('canvas');
      })(),

      noInitialRun: false,

      print: function(text) {
        console.log('[SOH] ' + text);
      },

      onAbort: function(what) {
        console.error('[Web] WebAssembly aborted: ' + what + ' (' + DebugLog.mem() + ')');
        DebugLog.open();
      },

      printErr: function(text) {
        console.error('[SOH] ' + text);
      },

      setStatus: function(text) {
        if (text) {
          setStatus(text);
        }
      },

      monitorRunDependencies: function(left) {
        if (left === 0) {
          setStatus('All dependencies loaded.');
        } else {
          setStatus('Loading... (' + left + ' remaining)');
        }
      },

      onRuntimeInitialized: function() {
        setStatus('Runtime initialized. Loading game files...');
        // Install soh.o2r (prefetched during page load) before any other file logic
        installSohO2r().then(function(installed) {
          if (installed) {
            console.log('[Web] soh.o2r installed to virtual filesystem');
          }
          // Check URL hash for o2r/ROM parameters first, then fall back to cached files
          if (checkHashO2r()) {
            // Downloading o2r files from URL hash
          } else if (!checkHashRom()) {
            checkCachedOtr();
          }
        });
      },

      locateFile: function(path) {
        return path;
      }
    };

    window.onerror = function(msg) {
      if (msg && msg.indexOf('abort') !== -1) {
        showError('An error occurred. Check the browser console for details.');
      }
    };

    // ---- Persist settings ----
    // The game writes its settings to /Save/shipofharkinian.json (IndexedDB-backed, see web_mount_idbfs) but
    // only saves go through web_save_to_idb, so copy the settings file to IndexedDB whenever it changes and
    // when the page is hidden or closed.
    (function() {
      var CONFIG = '/Save/shipofharkinian.json';
      var lastMtime = null, syncing = false, pending = false;
      function sync(reason) {
        if (typeof FS === 'undefined' || !FS.syncfs) return;
        if (syncing) { pending = true; return; }
        syncing = true;
        FS.syncfs(false, function(err) {
          syncing = false;
          if (err) console.warn('[Web] Saving settings failed (' + reason + '):', err);
          if (pending) { pending = false; sync('queued'); }
        });
      }
      setInterval(function() {
        if (!gameStarted || typeof FS === 'undefined') return;
        var mtime;
        try { mtime = FS.stat(CONFIG).mtime.getTime(); } catch (e) { return; }
        if (lastMtime !== null && mtime !== lastMtime) sync('settings changed');
        lastMtime = mtime;
      }, 1000);
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden' && gameStarted) sync('page hidden');
      });
      window.addEventListener('pagehide', function() { if (gameStarted) sync('page closed'); });
    })();

    // ---- Touch Gamepad (UI only — WASM integration handled separately) ----
    var TouchGamepad = {
      _active: false,
      _stickX: 0,       // -128..127
      _stickY: 0,       // -128..127
      _buttons: {},      // id -> true/false
      _stickTouchId: null,
      _stickCenterX: 0,
      _stickCenterY: 0,
      _knob: null,

      // Button IDs for the integration layer to read
      BUTTON_IDS: ['tb-a', 'tb-b', 'tb-z', 'tb-start', 'tb-r', 'tb-l', 'tb-cu', 'tb-cd', 'tb-cl', 'tb-cr', 'tb-esc'],

      init: function() {
        if (!('ontouchstart' in window) && navigator.maxTouchPoints <= 0) return;
        this._knob = document.getElementById('touch-stick-knob');
        document.documentElement.classList.add('touch-device');
        var self = this;
        // Track whether the settings menu is open, to hide the controls over it in portrait
        setInterval(function() {
          if (typeof Module === 'undefined' || typeof Module._web_menu_open !== 'function' || !Module.calledRun) return;
          var open = !!Module._web_menu_open();
          if (open !== document.documentElement.classList.contains('menu-open')) {
            document.documentElement.classList.toggle('menu-open', open);
          }
          // Tell the renderer how much of the screen the controls cover in portrait (per mille from the bottom)
          var inset = 0;
          if (innerHeight > innerWidth) {
            var top = document.getElementById('tb-start').getBoundingClientRect().top;
            inset = Math.max(0, Math.min(600, Math.round((innerHeight - top) / innerHeight * 1000)));
          }
          // Only once the game runs: before that the settings system doesn't exist yet
          if (gameStarted && inset !== self._insetSent && typeof Module._web_cvar_set_int === 'function') {
            self._insetSent = inset;
            var name = Module.allocateUTF8('gSettings.AdvancedResolution.PortraitBottomInset');
            Module._web_cvar_set_int(name, inset);
            Module._free(name);
          }
        }, 150);
        document.getElementById('touch-gamepad').classList.add('visible');
        this._active = true;
        this._setupButtons();
        this._setupStick();
        console.log('[TouchGamepad] Initialized for touch device');
      },

      // Public API for WASM integration
      isActive: function() { return this._active; },
      getStickX: function() { return this._stickX; },
      getStickY: function() { return this._stickY; },
      isButtonPressed: function(id) { return !!this._buttons[id]; },

      _setupButtons: function() {
        var self = this;
        this.BUTTON_IDS.forEach(function(id) {
          var el = document.getElementById(id);
          if (!el) return;
          el.addEventListener('touchstart', function(e) {
            e.preventDefault();
            el.classList.add('pressed');
            self._buttons[id] = true;
            resumeAudio(); // iOS: resume audio on gamepad touch
          }, { passive: false });
          el.addEventListener('touchend', function(e) {
            e.preventDefault();
            el.classList.remove('pressed');
            self._buttons[id] = false;
          }, { passive: false });
          el.addEventListener('touchcancel', function(e) {
            el.classList.remove('pressed');
            self._buttons[id] = false;
          });
        });
      },

      _setupStick: function() {
        var self = this;
        var zone = document.getElementById('touch-stick-zone');
        var base = document.getElementById('touch-stick-base');
        var RADIUS = 50;

        zone.addEventListener('touchstart', function(e) {
          e.preventDefault();
          resumeAudio(); // iOS: resume audio on stick touch
          var touch = e.changedTouches[0];
          self._stickTouchId = touch.identifier;
          var rect = base.getBoundingClientRect();
          self._stickCenterX = rect.left + rect.width / 2;
          self._stickCenterY = rect.top + rect.height / 2;
          self._updateStick(touch.clientX, touch.clientY, RADIUS);
        }, { passive: false });

        zone.addEventListener('touchmove', function(e) {
          e.preventDefault();
          for (var i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === self._stickTouchId) {
              self._updateStick(e.changedTouches[i].clientX, e.changedTouches[i].clientY, RADIUS);
              break;
            }
          }
        }, { passive: false });

        var endStick = function(e) {
          for (var i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === self._stickTouchId) {
              self._stickTouchId = null;
              self._knob.style.transform = 'translate(0px, 0px)';
              self._stickX = 0;
              self._stickY = 0;
              break;
            }
          }
        };
        zone.addEventListener('touchend', endStick, { passive: false });
        zone.addEventListener('touchcancel', endStick);
      },

      _updateStick: function(touchX, touchY, maxR) {
        var dx = touchX - this._stickCenterX;
        var dy = touchY - this._stickCenterY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
        this._knob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
        this._stickX = Math.round((dx / maxR) * 127);
        this._stickY = Math.round((-dy / maxR) * 127);
      }
    };

    // ESC button: dispatch real keyboard events so SDL/emscripten picks them up
    (function() {
      var escEl = document.getElementById('tb-esc');
      if (!escEl) return;
      var canvas = document.getElementById('canvas');
      escEl.addEventListener('touchstart', function(e) {
        e.preventDefault();
        escEl.classList.add('pressed');
        canvas.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', keyCode: 27, which: 27, bubbles: true }));
      }, { passive: false });
      escEl.addEventListener('touchend', function(e) {
        e.preventDefault();
        escEl.classList.remove('pressed');
        canvas.dispatchEvent(new KeyboardEvent('keyup', { key: 'Escape', code: 'Escape', keyCode: 27, which: 27, bubbles: true }));
      }, { passive: false });
      escEl.addEventListener('touchcancel', function() {
        escEl.classList.remove('pressed');
        canvas.dispatchEvent(new KeyboardEvent('keyup', { key: 'Escape', code: 'Escape', keyCode: 27, which: 27, bubbles: true }));
      });
    })();

    // Auto-init when page loads
    if (document.readyState === 'complete') {
      TouchGamepad.init();
    } else {
      window.addEventListener('load', function() { TouchGamepad.init(); });
    }
  </script>

  <script>
    // ---- Mobile keyboard for ImGui text inputs ----
    // iOS requires focus() in the same call stack as a user gesture.
    // The C++ side sets Module._wantsTextInput when ImGui has an active text field.
    // We check this flag on every touch and focus the hidden input if needed.
    (function() {
      var mobileInput = document.getElementById('mobile-keyboard-input');
      if (!mobileInput) return;
      var isShowingKeyboard = false;

      // Pipe typed characters from the hidden input into SDL/Emscripten as key events
      mobileInput.addEventListener('input', function(e) {
        var canvas = document.getElementById('canvas');
        var val = mobileInput.value;
        if (val.length > 0) {
          // Send each character as a keypress to the canvas
          for (var i = 0; i < val.length; i++) {
            var ch = val.charCodeAt(i);
            canvas.dispatchEvent(new KeyboardEvent('keydown', { key: val[i], charCode: ch, keyCode: ch, which: ch, bubbles: true }));
            canvas.dispatchEvent(new KeyboardEvent('keypress', { key: val[i], charCode: ch, keyCode: ch, which: ch, bubbles: true }));
            canvas.dispatchEvent(new KeyboardEvent('keyup', { key: val[i], charCode: ch, keyCode: ch, which: ch, bubbles: true }));
          }
          mobileInput.value = '';
        }
      });

      // Check on every touch if ImGui wants text input
      function checkKeyboard() {
        try {
          if (Module && Module._web_wants_text_input) {
            var wants = Module._web_wants_text_input();
            if (wants && !isShowingKeyboard) {
              isShowingKeyboard = true;
              mobileInput.focus();
            } else if (!wants && isShowingKeyboard) {
              isShowingKeyboard = false;
              mobileInput.blur();
            }
          }
        } catch(e) {}
      }

      document.addEventListener('touchend', checkKeyboard, true);
      document.addEventListener('click', checkKeyboard, true);

      // Focusing the hidden input can make the browser scroll or zoom the page to show it, which leaves every
      // later touch offset from where the game draws. Put the page back once the keyboard is gone.
      function resetPageScroll() {
        if (isShowingKeyboard) return;
        if (window.scrollX || window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
          window.dispatchEvent(new Event('resize'));
        }
      }
      mobileInput.addEventListener('blur', function() { setTimeout(resetPageScroll, 50); });
      window.addEventListener('scroll', resetPageScroll);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resetPageScroll);
        window.visualViewport.addEventListener('scroll', resetPageScroll);
      }
      // iOS Safari ignores user-scalable=no; block its pinch and double-tap zoom gestures directly
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd < 350 && e.cancelable && e.target && e.target.id === 'canvas') e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();

    // ---- Touch-drag scrolling for ImGui ----
    // ImGui only scrolls via mouse wheel. Convert touch drag on the canvas
    // into synthetic wheel events so scrollable ImGui panels work on mobile.
    (function() {
      function initTouchScroll(canvas) {
        if (canvas._touchScrollBound) return;
        canvas._touchScrollBound = true;
      var lastTouchY = null;
      var lastTouchX = null;
      var scrollTouchId = null;

      canvas.addEventListener('touchstart', function(e) {
        // Only track one finger for scrolling; gamepad handles its own touches
        if (scrollTouchId !== null) return;
        var t = e.changedTouches[0];
        // Ignore touches in the gamepad zones (bottom-left stick, right-side buttons), unless the
        // menu has the whole screen
        if (!document.documentElement.classList.contains('menu-open') && t.clientY > window.innerHeight * 0.5) return;
        scrollTouchId = t.identifier;
        lastTouchY = t.clientY;
        lastTouchX = t.clientX;
      }, { passive: true });

      canvas.addEventListener('touchmove', function(e) {
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i];
          if (t.identifier !== scrollTouchId) continue;

          var dy = lastTouchY - t.clientY;
          var dx = lastTouchX - t.clientX;
          lastTouchY = t.clientY;
          lastTouchX = t.clientX;

          // Only scroll if vertical drag is dominant
          if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 1) {
            canvas.dispatchEvent(new WheelEvent('wheel', {
              deltaY: dy * 3,
              deltaX: 0,
              bubbles: true,
              clientX: t.clientX,
              clientY: t.clientY
            }));
          }
        }
      }, { passive: true });

      canvas.addEventListener('touchend', function(e) {
        for (var i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === scrollTouchId) {
            scrollTouchId = null;
          }
        }
      }, { passive: true });

      canvas.addEventListener('touchcancel', function() {
        scrollTouchId = null;
      }, { passive: true });
      }

      // Try immediately and retry until canvas exists
      var c = document.getElementById('canvas');
      if (c) {
        initTouchScroll(c);
      }
      // Retry in case canvas isn't ready yet (Emscripten may recreate it)
      setTimeout(function() { var c = document.getElementById('canvas'); if (c) initTouchScroll(c); }, 1000);
      setTimeout(function() { var c = document.getElementById('canvas'); if (c) initTouchScroll(c); }, 3000);
      setTimeout(function() { var c = document.getElementById('canvas'); if (c) initTouchScroll(c); }, 5000);
    })();
  </script>
